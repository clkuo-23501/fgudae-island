    function createSeededRandom(seed) {
      return function () {
        let t = (seed += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function makeRoundedHill(rx, h, rz, colorHex, hasSnow = false) {
      const grp = new THREE.Group();
      const geo = new THREE.SphereGeometry(1, 28, 22, 0, Math.PI * 2, 0, Math.PI * 0.56);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const domeFactor = Math.pow(Math.max(0, vy), 0.72);
        const ridgeWave = 1 + 0.14 * Math.sin(vx * 3.1 + vz * 2.2) + 0.08 * Math.cos(vz * 4.0);
        pos.setXYZ(i, vx * rx * ridgeWave, domeFactor * h, vz * rz * ridgeWave);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.88 }));
      grp.add(mesh);

      if (hasSnow) {
        const snowGeo = new THREE.SphereGeometry(1, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.24);
        snowGeo.scale(rx * 0.44, h * 0.34, rz * 0.44);
        const snow = new THREE.Mesh(snowGeo, new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.55 }));
        snow.position.y = h * 0.67;
        grp.add(snow);
      }
      return grp;
    }

    function makeTree(variant, scale = 1) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11 * scale, 0.17 * scale, 0.9 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.9 })
      );
      trunk.position.y = 0.45 * scale;
      tree.add(trunk);

      if (variant === 'pine') {
        const colors = [0x2d6a4f, 0x40916c, 0x52b788];
        for (let t = 0; t < 3; t++) {
          const cone = new THREE.Mesh(
            new THREE.ConeGeometry((0.78 - t * 0.17) * scale, (1.05 - t * 0.15) * scale, 10),
            new THREE.MeshStandardMaterial({ color: colors[t], roughness: 0.8 })
          );
          cone.position.y = (1.1 + t * 0.55) * scale;
          tree.add(cone);
        }
      } else {
        const leafColors = [0x4c956c, 0x6a994e, 0x80b918];
        const offsets = [
          [0, 1.35, 0, 0.72],
          [-0.38, 1.12, 0.24, 0.52],
          [0.36, 1.15, -0.22, 0.54]
        ];
        offsets.forEach(([ox, oy, oz, r], i) => {
          const puff = new THREE.Mesh(
            new THREE.DodecahedronGeometry(r * scale, 1),
            new THREE.MeshStandardMaterial({ color: leafColors[i % leafColors.length], roughness: 0.82 })
          );
          puff.position.set(ox * scale, oy * scale, oz * scale);
          tree.add(puff);
        });
      }
      return tree;
    }

      ];
      mtnLayers.forEach((ly, li) => {
        for (let i = 0; i < ly.count; i++) {
          const baseT = i / (ly.count - 1);
          const jitterT = Math.min(1, Math.max(0, baseT + (randMtn() - 0.5) * 0.065));
          const ang = Math.PI * 0.54 + jitterT * Math.PI * 0.92;
          const radJitter = ly.rad + (randMtn() - 0.5) * 6.5;
          const ridgeRipple = 0.68 + 0.48 * Math.abs(Math.sin(i * 2.15 + li * 1.4)) + randMtn() * 0.36;
          const h = ly.baseH * ridgeRipple;
          const rx = ly.rxBase * (0.85 + randMtn() * 0.42);
          const rz = ly.rzBase * (0.85 + randMtn() * 0.42);

          const hill = makeRoundedHill(rx, h, rz, ly.color, li === 0 && h > 23.5);
          hill.position.set(Math.cos(ang) * radJitter + 12, -1.6, Math.sin(ang) * radJitter);
          hill.rotation.y = randMtn() * Math.PI * 2;
          scene.add(hill);
        }
      });

      // 龜山島（側面正對山谷缺口）
      const guishan = new THREE.Group();
      const shell = makeRoundedHill(7.8, 7.6, 12.2, 0x3d7349, false);
      const head = makeRoundedHill(4.6, 5.2, 5.2, 0x4b8556, false);
      head.position.set(0, 0, 11.4);
      const tail = makeRoundedHill(3.0, 2.4, 5.8, 0x538c5e, false);
      tail.position.set(0, 0, -13.0);
      guishan.add(shell, head, tail);
      guishan.position.set(70, -1.3, 0);
      scene.add(guishan);

      const gsWave1 = new THREE.Mesh(
        new THREE.RingGeometry(11.8, 13.0, 32),
        new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.62, side: THREE.DoubleSide })
      );
      gsWave1.rotation.x = -Math.PI / 2;
      gsWave1.scale.set(0.68, 1.28, 1);
      gsWave1.position.set(70, -0.18, 0);
      scene.add(gsWave1);
      shoreWaves.push({ mesh: gsWave1, baseScaleX: 0.68, baseScaleY: 1.28, phase: 0.7, isOuter: false });

      for (let i = 0; i < 6; i++) {
        const sp = new THREE.Mesh(
          new THREE.SphereGeometry(0.65 + i * 0.14, 10, 8),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.42 })
        );
        smokeParticles.push({ mesh: sp, offset: i / 6 });
        scene.add(sp);
      }

      // 雲朵與台灣藍鵲
      for (let c = 0; c < 6; c++) {
        const cg = new THREE.Group();
        for (let b = 0; b < 3; b++) {
          const puff = new THREE.Mesh(
            new THREE.DodecahedronGeometry(1.6 + (b % 2) * 0.5, 1),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 })
          );
          puff.position.set((b - 1) * 1.4, (b % 2) * 0.3, 0);
          cg.add(puff);
        }
        cg.position.set(-40 + c * 18, 22 + (c % 3) * 3, -24 + (c % 2) * 32);
        clouds.push(cg);
        scene.add(cg);
      }

      for (let m = 0; m < 4; m++) {
        const magpieObj = makeFormosanBlueMagpie();
        magpies.push({ ...magpieObj, r: 17 + m * 5, y: 12 + m * 1.6, speed: 0.32 + m * 0.04, phase: m * 1.6 });
        scene.add(magpieObj.group);
      }

      // 五座獨立小島（深埋海床基座看不到底部 + 海岸海浪白沫環 + 樹木植栽 + 男女生角色）
      const shirtPalette = [0xe06d53, 0x3b82f6, 0xeab308, 0x10b981, 0x8b5cf6];
      const hairPalette = [0x1e293b, 0x4a2c18, 0x2c1e16, 0x5c3a21];
      const treePlacements = [
        [[-2.5, -1.6, 'pine', 0.85], [2.4, -1.4, 'broad', 0.8], [-2.1, 2.0, 'broad', 0.75], [2.2, 1.9, 'pine', 0.8]],
        [[-3.3, -2.1, 'broad', 1.0], [3.2, -2.3, 'pine', 1.05], [-3.5, 1.8, 'pine', 0.95], [3.1, 2.2, 'broad', 1.0], [0.2, -3.6, 'broad', 0.9]],
        [[-2.9, -2.0, 'pine', 0.95], [2.8, -1.9, 'pine', 0.9], [-2.7, 2.1, 'broad', 0.85], [2.7, 2.0, 'pine', 0.95]],
        [[-3.9, -2.4, 'pine', 1.1], [3.8, -2.2, 'pine', 1.15], [-3.7, 2.5, 'broad', 1.05], [3.6, 2.6, 'pine', 1.0], [-1.2, -4.2, 'pine', 0.95], [1.4, 4.1, 'broad', 0.9]],
        [[-3.5, -2.2, 'broad', 1.0], [3.4, -2.4, 'broad', 0.95], [-3.3, 2.4, 'pine', 0.95], [3.5, 2.1, 'broad', 1.05], [-0.4, -4.0, 'pine', 0.9]]
      ];

      ISLAND_CONFIGS.forEach((cfg, idx) => {
        const root = new THREE.Group();
        root.position.set(cfg.pos.x, 0, cfg.pos.z);

        const seabedBase = new THREE.Mesh(
          new THREE.CylinderGeometry(cfg.radius * 0.96, cfg.radius * 1.22, 3.6, 22),
          new THREE.MeshStandardMaterial({ color: 0x6b4c38, roughness: 0.95 })
        );
        seabedBase.position.y = -2.4;
        seabedBase.userData.islandId = cfg.id;

        const rock = new THREE.Mesh(
          new THREE.CylinderGeometry(cfg.radius * 1.04, cfg.radius * 0.96, 1.35, 22),
          new THREE.MeshStandardMaterial({ color: 0xa67c5b, roughness: 0.86 })
        );
        rock.position.y = -0.32;
        rock.userData.islandId = cfg.id;

        const beach = new THREE.Mesh(
          new THREE.CylinderGeometry(cfg.radius * 1.07, cfg.radius * 1.05, 0.24, 22),
          new THREE.MeshStandardMaterial({ color: 0xe6d5b8, roughness: 0.85 })
        );
        beach.position.y = 0.24;
        beach.userData.islandId = cfg.id;

        const grass = new THREE.Mesh(
          new THREE.CylinderGeometry(cfg.radius * 1.01, cfg.radius * 1.03, 0.46, 22),
          new THREE.MeshStandardMaterial({ color: 0x5a9e4b, roughness: 0.8 })
        );
        grass.position.y = 0.48;
        grass.userData.islandId = cfg.id;

        root.add(seabedBase, rock, beach, grass);
        clickableMeshes.push(seabedBase, rock, beach, grass);

        const innerWave = new THREE.Mesh(
          new THREE.RingGeometry(cfg.radius * 1.04, cfg.radius * 1.18, 32),
          new THREE.MeshBasicMaterial({ color: 0xf0f9ff, transparent: true, opacity: 0.72, side: THREE.DoubleSide })
        );
        innerWave.rotation.x = -Math.PI / 2;
        innerWave.position.y = -0.14;
        scene.add(innerWave);
        shoreWaves.push({ mesh: innerWave, baseScaleX: 1, baseScaleY: 1, phase: idx * 1.1, isOuter: false });

        const outerWave = new THREE.Mesh(
          new THREE.RingGeometry(cfg.radius * 1.18, cfg.radius * 1.32, 32),
          new THREE.MeshBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.48, side: THREE.DoubleSide })
        );
        outerWave.rotation.x = -Math.PI / 2;
        outerWave.position.y = -0.18;
        scene.add(outerWave);
        shoreWaves.push({ mesh: outerWave, baseScaleX: 1, baseScaleY: 1, phase: idx * 1.1 + 1.5, isOuter: true });

        (treePlacements[idx] || []).forEach(([tx, tz, variant, sc]) => {
          const tree = makeTree(variant, sc);
          tree.position.set(tx, 0.68, tz);
          root.add(tree);

          const shrub = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.32 * sc, 1),
            new THREE.MeshStandardMaterial({ color: 0x6a994e, roughness: 0.85 })
          );
          shrub.position.set(tx + 0.45 * sc, 0.82, tz + 0.35 * sc);
          root.add(shrub);
        });

        // 島嶼專屬建築地標
        if (cfg.id === 'portal') {
          const arch = new THREE.Mesh(
            new THREE.TorusGeometry(1.75, 0.3, 10, 22, Math.PI),
            new THREE.MeshStandardMaterial({ color: 0x78716c, roughness: 0.8 })
          );
          arch.position.set(0, 1.4, -0.5);
          const runeRing = new THREE.Mesh(
            new THREE.TorusGeometry(1.15, 0.08, 8, 24),
            new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.7 })
          );
          runeRing.position.set(0, 1.75, -0.5);
          const baseStep = new THREE.Mesh(
            new THREE.CylinderGeometry(2.1, 2.35, 0.32, 16),
            new THREE.MeshStandardMaterial({ color: 0xd6d3d1 })
          );
          baseStep.position.set(0, 0.8, -0.5);
          root.add(arch, runeRing, baseStep);
        } else if (cfg.id === 'village') {
          const house = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.75, 2.2), new THREE.MeshStandardMaterial({ color: 0xfef3c7 }));
          house.position.set(-0.6, 1.55, -0.4);
          const roof = new THREE.Mesh(new THREE.ConeGeometry(2.15, 1.25, 4), new THREE.MeshStandardMaterial({ color: 0xc2410c }));
          roof.position.set(-0.6, 3.0, -0.4);
          roof.rotation.y = Math.PI * 0.25;
          const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.85, 0.36), new THREE.MeshStandardMaterial({ color: 0x78350f }));
          chimney.position.set(0.25, 3.15, -0.65);
          const door = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.95, 0.12), new THREE.MeshStandardMaterial({ color: 0x78350f }));
          door.position.set(-0.6, 1.15, 0.72);
          const winMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xf59e0b, emissiveIntensity: 0.2 });
          windowMats.push(winMat);
          const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.12), winMat);
          win1.position.set(-1.35, 1.65, 0.72);
          const win2 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.12), winMat);
          win2.position.set(0.15, 1.65, 0.72);
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.7), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
          pole.position.set(1.65, 2.0, 0.5);
          const flag = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.58, 0.06), new THREE.MeshStandardMaterial({ color: 0x2b7a9b }));
          flag.position.set(2.12, 3.0, 0.5);
          root.add(house, roof, chimney, door, win1, win2, pole, flag);
        } else if (cfg.id === 'camp') {
          const tentConfigs = [
            { x: -1.1, z: -0.95, r: 1.5, h: 1.85, rot: Math.PI * 0.25, color: 0xd97742 },
            { x: 1.35, z: -1.15, r: 1.25, h: 1.55, rot: Math.PI * 0.12, color: 0x2b7a9b },
            { x: -1.45, z: 1.15, r: 1.2, h: 1.5, rot: Math.PI * 0.38, color: 0xeab308 }
          ];
          tentConfigs.forEach(tc => {
            const tent = new THREE.Mesh(
              new THREE.ConeGeometry(tc.r, tc.h, 4),
              new THREE.MeshStandardMaterial({ color: tc.color, roughness: 0.8 })
            );
            tent.position.set(tc.x, 0.68 + tc.h * 0.5, tc.z);
            tent.rotation.y = tc.rot;

            const tentFlap = new THREE.Mesh(
              new THREE.ConeGeometry(tc.r * 0.34, tc.h * 0.68, 3),
              new THREE.MeshStandardMaterial({ color: 0x334155 })
            );
            tentFlap.position.set(tc.x + Math.sin(tc.rot) * tc.r * 0.42, 0.68 + tc.h * 0.34, tc.z + Math.cos(tc.rot) * tc.r * 0.42);
            tentFlap.rotation.y = tc.rot;
            root.add(tent, tentFlap);
          });

          for (let lg = 0; lg < 3; lg++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.1, 8), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
            log.position.set(1.15, 0.8, 1.05);
            log.rotation.set(Math.PI * 0.45, lg * (Math.PI / 3), 0);
            root.add(log);
          }
          const flame = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.85, 8), new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.45 }));
          flame.position.set(1.15, 1.25, 1.05);
          root.add(flame);
        } else if (cfg.id === 'peaks') {
          const peakMain = makeRoundedHill(2.7, 4.4, 2.5, 0x577590, true);
          peakMain.position.set(-0.6, 0.65, -0.3);
          const peakSub = makeRoundedHill(1.9, 2.9, 1.8, 0x6c8ba3, true);
          peakSub.position.set(1.55, 0.65, 0.7);
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.35), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          pole.position.set(-0.6, 5.2, -0.3);
          const flag = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.45, 0.05), new THREE.MeshStandardMaterial({ color: 0xe11d48 }));
          flag.position.set(-0.2, 5.65, -0.3);
          root.add(peakMain, peakSub, pole, flag);
        } else if (cfg.id === 'workplace') {
          const bldg = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.8, 2.3), new THREE.MeshStandardMaterial({ color: 0x475569 }));
          bldg.position.set(0, 2.55, -0.3);
          const roofTrim = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.25, 2.5), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
          roofTrim.position.set(0, 4.5, -0.3);
          const door = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.15, 0.14), new THREE.MeshStandardMaterial({ color: 0xbae6fd }));
          door.position.set(0, 1.25, 0.88);
          const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.12, 0.6), new THREE.MeshStandardMaterial({ color: 0x2b7a9b }));
          canopy.position.set(0, 1.9, 1.05);
          root.add(bldg, roofTrim, door, canopy);
          for (let wy = 0; wy < 2; wy++) {
            for (let wx = -1; wx <= 1; wx++) {
              const wm = new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xf59e0b, emissiveIntensity: 0.25 });
              windowMats.push(wm);
              const win = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.48, 0.12), wm);
              win.position.set(wx * 0.72, 2.55 + wy * 0.9, 0.88);
              root.add(win);
            }
          }
        }

        const stuCount = cfg.radius >= 5.8 ? 4 : 3;
        for (let s = 0; s < stuCount; s++) {
          const isFemale = (idx + s) % 2 === 1;
          const charParts = makeStudentCharacter(
            shirtPalette[(idx + s) % shirtPalette.length],
            isFemale,
            hairPalette[(idx + s) % hairPalette.length]
          );
          const ang = (s / stuCount) * Math.PI * 2;
          charParts.group.position.set(Math.cos(ang) * cfg.radius * 0.48, 0.7, Math.sin(ang) * cfg.radius * 0.48);
          root.add(charParts.group);
          students.push({
            mesh: charParts.group,
            leftLeg: charParts.leftLeg,
            rightLeg: charParts.rightLeg,
            leftArm: charParts.leftArm,
            rightArm: charParts.rightArm,
            islandIdx: idx,
            angle: ang,
            speed: 0.16 + s * 0.035,
            onBridge: false,
            bridgeIdx: idx,
            progress: 0
          });
        }

        scene.add(root);
        islandGroups[cfg.id] = { group: root, phase: idx * 1.25, cfg };
      });

      // 五座島閉合環狀吊橋
      for (let i = 0; i < ISLAND_CONFIGS.length; i++) {
        const nextIdx = (i + 1) % ISLAND_CONFIGS.length;
        const plankCount = 12;
        const planks = [];
        for (let p = 0; p < plankCount; p++) {
          const pk = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.12, 0.42), new THREE.MeshStandardMaterial({ color: 0x9c6b43 }));
          scene.add(pk);
          planks.push(pk);
        }
        const ropeMat = new THREE.LineBasicMaterial({ color: 0x5c3a21 });
        const ropeL = new THREE.Line(new THREE.BufferGeometry(), ropeMat);
        const ropeR = new THREE.Line(new THREE.BufferGeometry(), ropeMat);
        scene.add(ropeL, ropeR);
        bridges.push({ from: i, to: nextIdx, planks, ropeL, ropeR });
      }

      // 雨滴系統
      const rainCount = 450;
      const rainPos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = (Math.random() - 0.5) * 90;
        rainPos[i * 3 + 1] = Math.random() * 36;
        rainPos[i * 3 + 2] = (Math.random() - 0.5) * 90;
      }
      const rainGeo = new THREE.BufferGeometry();
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
      rainSystem = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xe0f2fe, size: 0.25, transparent: true, opacity: 0.6 }));
      rainSystem.visible = false;
      scene.add(rainSystem);

      // 點擊射線偵測
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downX = 0, downY = 0;
      renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);
        if (hits.length > 0 && hits[0].object.userData.islandId) {
          focusOnIsland(hits[0].object.userData.islandId);
        }
      });

      window.addEventListener('resize', () => {
        if (!renderer || !camera) return;
        camera.aspect = Math.max(1, container.clientWidth) / Math.max(1, container.clientHeight);
        camera.updateProjectionMatrix();
        renderer.setSize(Math.max(1, container.clientWidth), Math.max(1, container.clientHeight));
      });
    }

    function updateProjectedLabelsPosition() {
      if (!camera) return;
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth;
      const h = container.clientHeight;
      ISLAND_CONFIGS.forEach(cfg => {
        const el = document.getElementById(`label-${cfg.id}`);
        const obj = islandGroups[cfg.id];
        if (!el || !obj) return;
        const worldPos = new THREE.Vector3(cfg.pos.x, obj.group.position.y + 4.8, cfg.pos.z);
        worldPos.project(camera);
        if (worldPos.z > 1) {
          el.style.display = 'none';
        } else {
          el.style.display = 'block';
          el.style.left = `${(worldPos.x * 0.5 + 0.5) * w}px`;
          el.style.top = `${(-worldPos.y * 0.5 + 0.5) * h}px`;
        }
      });
    }

    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      if (!renderer || !scene || !camera) return;
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const t = now * 0.001;

      if (!state.reduceMotion) {
        if (waterMesh && waterBasePos) {
          const arr = waterMesh.geometry.attributes.position.array;
          for (let i = 0; i < arr.length; i += 3) {
            arr[i + 1] = Math.sin(waterBasePos[i] * 0.1 + t * 1.2) * 0.14 + Math.cos(waterBasePos[i + 2] * 0.1 + t) * 0.14;
          }
          waterMesh.geometry.attributes.position.needsUpdate = true;
        }

        Object.values(islandGroups).forEach((obj) => {
          obj.group.position.y = Math.sin(t * 0.8 + obj.phase) * 0.16;
        });

        shoreWaves.forEach((w, wi) => {
          const waveCycle = Math.sin(t * 1.4 + w.phase);
          const pulse = 1 + (w.isOuter ? 0.045 : 0.03) * waveCycle;
          w.mesh.scale.set(w.baseScaleX * pulse, w.baseScaleY * pulse, 1);
          w.mesh.material.opacity = (w.isOuter ? 0.42 : 0.65) + 0.18 * Math.cos(t * 1.4 + w.phase);
          if (wi > 0) {
            const cfgIdx = Math.floor((wi - 1) / 2);
            const cfg = ISLAND_CONFIGS[cfgIdx];
            if (cfg) {
              w.mesh.position.x = cfg.pos.x;
              w.mesh.position.z = cfg.pos.z;
            }
          }
        });

        smokeParticles.forEach((p) => {
          const cycle = (t * 0.16 + p.offset) % 1;
          p.mesh.position.set(70 + cycle * 2.5, 8.2 + cycle * 9, -1.5 + Math.sin(t + p.offset * 5) * 0.8);
          p.mesh.material.opacity = (1 - cycle) * 0.45;
        });

        clouds.forEach((c) => {
          c.position.x += dt * 0.8;
          if (c.position.x > 65) c.position.x = -65;
        });

        magpies.forEach((m) => {
          const ang = t * m.speed + m.phase;
          m.group.position.set(Math.cos(ang) * m.r, m.y + Math.sin(t * 1.5 + m.phase) * 0.6, Math.sin(ang) * m.r);
          m.group.rotation.y = -ang;
          const flap = Math.sin(t * 6.5 + m.phase) * 0.42;
          m.lWing.rotation.z = flap;
          m.rWing.rotation.z = -flap;
        });

        students.forEach((st, idx) => {
          const cfg = ISLAND_CONFIGS[st.islandIdx];
          const stride = Math.sin(t * 3.2 + idx * 1.7) * 0.42;
          if (st.leftLeg && st.rightLeg) {
            st.leftLeg.rotation.x = stride;
            st.rightLeg.rotation.x = -stride;
            st.leftArm.rotation.x = -stride * 0.85;
            st.rightArm.rotation.x = stride * 0.85;
          }

          if (!st.onBridge) {
            st.angle += st.speed * dt;
            const r = cfg.radius * 0.48;
            const nx = Math.cos(st.angle) * r;
            const nz = Math.sin(st.angle) * r;
            st.mesh.rotation.y = Math.atan2(-Math.sin(st.angle), Math.cos(st.angle));
            st.mesh.position.set(nx, 0.7 + Math.abs(Math.sin(t * 3.2 + idx)) * 0.04, nz);
            if (Math.sin(t * 0.22 + idx * 2.3) > 0.985) {
              st.onBridge = true;
              st.bridgeIdx = st.islandIdx;
              st.progress = 0;
              scene.add(st.mesh);
            }
          } else {
            st.progress += dt * 0.13;
            const aObj = islandGroups[ISLAND_CONFIGS[st.bridgeIdx].id];
            const bObj = islandGroups[ISLAND_CONFIGS[(st.bridgeIdx + 1) % ISLAND_CONFIGS.length].id];
            const pA = aObj.group.position;
            const pB = bObj.group.position;
            const u = new THREE.Vector3().subVectors(pB, pA).normalize();
            const sPt = pA.clone().addScaledVector(u, aObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
            const ePt = pB.clone().addScaledVector(u, -bObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
            const pos = new THREE.Vector3().lerpVectors(sPt, ePt, Math.min(1, st.progress));
            pos.y -= Math.sin(Math.min(1, st.progress) * Math.PI) * 0.65;
            st.mesh.rotation.y = Math.atan2(u.x, u.z);
            st.mesh.position.copy(pos);
            if (st.progress >= 1) {
              st.onBridge = false;
              st.islandIdx = (st.bridgeIdx + 1) % ISLAND_CONFIGS.length;
              islandGroups[ISLAND_CONFIGS[st.islandIdx].id].group.add(st.mesh);
            }
          }
        });
      }

      bridges.forEach((br) => {
        const aObj = islandGroups[ISLAND_CONFIGS[br.from].id];
        const bObj = islandGroups[ISLAND_CONFIGS[br.to].id];
        const pA = aObj.group.position;
        const pB = bObj.group.position;
        const dir = new THREE.Vector3().subVectors(pB, pA);
        const u = dir.clone().normalize();
        const sPt = pA.clone().addScaledVector(u, aObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
        const ePt = pB.clone().addScaledVector(u, -bObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
        const yaw = Math.atan2(u.x, u.z);
        const sideVec = new THREE.Vector3(-u.z, 0, u.x).multiplyScalar(0.55);

        br.planks.forEach((pk, pi) => {
          const frac = (pi + 0.5) / br.planks.length;
          const pos = new THREE.Vector3().lerpVectors(sPt, ePt, frac);
          pos.y -= Math.sin(frac * Math.PI) * 0.65;
          pk.position.copy(pos);
          pk.rotation.y = yaw;
        });

        const ptsL = [], ptsR = [];
        for (let k = 0; k <= 14; k++) {
          const frac = k / 14;
          const pt = new THREE.Vector3().lerpVectors(sPt, ePt, frac);
          pt.y += 0.68 - Math.sin(frac * Math.PI) * 0.5;
          ptsL.push(pt.clone().add(sideVec));
          ptsR.push(pt.clone().sub(sideVec));
        }
        br.ropeL.geometry.setFromPoints(ptsL);
        br.ropeR.geometry.setFromPoints(ptsR);
      });

      if (rainSystem && rainSystem.visible && !state.reduceMotion) {
        const rArr = rainSystem.geometry.attributes.position.array;
        for (let i = 1; i < rArr.length; i += 3) {
          rArr[i] -= dt * 28;
          if (rArr[i] < -1) rArr[i] = 34;
        }
        rainSystem.geometry.attributes.position.needsUpdate = true;
      }

      if (cameraAnim.active) {
        camera.position.lerp(cameraAnim.targetPos, 0.08);
        if (controls) controls.target.lerp(cameraAnim.targetLook, 0.08);
        if (camera.position.distanceTo(cameraAnim.targetPos) < 0.25) cameraAnim.active = false;
      }

      if (controls) controls.update();
      renderer.render(scene, camera);
      updateProjectedLabelsPosition();
    }

    function drawMiniIslandCanvas(islandId) {
      const canvas = document.getElementById('mini-island-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);
      ctx.fillStyle = '#2b7a9b';
      ctx.fillRect(0, 82, 128, 46);
      ctx.fillStyle = '#a67c5b';
      ctx.beginPath(); ctx.ellipse(64, 84, 42, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a9e4b';
      ctx.beginPath(); ctx.ellipse(64, 74, 44, 15, 0, 0, Math.PI * 2); ctx.fill();

      const cfg = ISLAND_CONFIGS.find(i => i.id === islandId);
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cfg ? cfg.icon : '🏝️', 64, 62);
    }

      const cfg = ISLAND_CONFIGS.find(i => i.id === islandId);

      renderLabelsAndNav();
      openIslandDrawer(islandId);

                  <div class="text-[11px] font-bold opacity-90">獨立專題網頁已解鎖</div>
                  <div class="text-base font-black mt-0.5">🏔️ 前往完整版【百岳修煉島】網站 ↗</div>
                  <div class="text-[11px] opacity-90 mt-1">查看完整歷屆證照統計與百岳攀登地圖</div>
                </div>
                <span class="text-2xl">🚀</span>
              </div>
            </a>
          ` : `
            <div class="p-4 rounded-2xl bg-slate-800 text-white space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-black text-amber-300">🔒 完整版【百岳修煉島】網站僅限在校生開啟</span>
              </div>
              <p class="text-[11px] text-slate-300">訪客可先於下方瀏覽去識別化的最新登記通過名單；驗證學號後即可開啟獨立專頁連結。</p>
              <button type="button" onclick="openRoleModal('student')"
                class="w-full py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-900 text-xs font-black transition">
                輸入學號解鎖前往 ➔
              </button>
            </div>
          `}

          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-black text-slate-800">📋 最新登記通過名單</h3>
              <div class="flex gap-1">
                ${['全部', '115級', '114級', '113級', '112級', '111級'].map(g => `
                  <button type="button" onclick="setPeaksCohort('${g}')"
                    class="px-2 py-0.5 rounded-md text-[11px] font-bold ${state.peaksCohort === g ? 'bg-[#4f6d7a] text-white' : 'bg-white border border-slate-200 text-slate-600'}">
                    ${g}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="space-y-2">
              ${filteredRecords.map(rec => `
                <div class="p-3 rounded-2xl bg-white border border-slate-200 flex items-center justify-between gap-2">
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${rec.grade}</span>
                      <span class="text-xs font-black text-slate-800">${formatDisplayName(rec.name)}</span>
                      ${isStudent ? `<span class="text-[11px] font-mono text-slate-400">${rec.studentId}</span>` : ''}
                    </div>
                    <div class="text-xs font-bold text-[#2b7a9b] mt-1">🏅 ${escapeHtml(rec.certName)}</div>
                  </div>
                  <div class="text-right flex-shrink-0">
                    <span class="text-[11px] font-mono font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg">${rec.date}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (islandId === 'workplace') {
        const fields = ['全部', '金融銀行', '證券投信', '企業永續', '公部門與研究'];
        const offers = state.offerFilter === '全部' ? INTERNSHIP_OFFERS : INTERNSHIP_OFFERS.filter(o => o.field === state.offerFilter);
        body.innerHTML = `
          <div class="bg-[#eff4f8] border border-[#d6e2ec] rounded-2xl p-3.5 text-xs text-slate-700">
            歡迎登陸<strong>【職場副本島】</strong>！以下為本系在校生最新企業實習與職場體驗錄取榜單。
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${fields.map(f => `
              <button type="button" onclick="setOfferFilter('${f}')"
                class="px-3 py-1 rounded-full text-xs font-bold ${state.offerFilter === f ? 'bg-[#3b526b] text-white' : 'bg-white border border-slate-200 text-slate-600'}">
                ${f}
              </button>
            `).join('')}
          </div>
          <div class="space-y-2.5">
            ${offers.map(o => `
              <div class="p-3.5 rounded-2xl bg-white border border-slate-200 space-y-1">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-[#e4f0f7] text-[#2b5b78]">${o.field} · ${o.period}</span>
                  <span class="text-[11px] font-mono text-slate-400">${o.cohort} · ${o.studentId}</span>
                </div>
                <div class="font-black text-sm text-slate-800">${o.company} — ${o.role}</div>
                <div class="text-xs font-bold text-emerald-700">🎉 錄取同學：${o.name}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      drawer.classList.remove('translate-y-full', 'md:translate-x-full');
    }

    /* =========================================================================
       6. 互動事件與日曆選擇器
       ========================================================================= */
    function renderCalendarPopover() {
      const y = state.calendarMonth.getFullYear();
      const m = state.calendarMonth.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += '<div></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${y}/${String(m + 1).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
        const active = state.selectedExamDate === ds;
        cells += `<button type="button" onclick="selectCalendarDay('${ds}')"
          class="py-1 rounded-lg text-[11px] font-bold ${active ? 'bg-[#b5653b] text-white' : 'hover:bg-amber-50 text-slate-700'}">${d}</button>`;
      }
      return `
        <div class="p-3 rounded-2xl bg-white border border-slate-300 shadow-lg space-y-2">
          <div class="flex items-center justify-between text-xs font-black">
            <button type="button" onclick="shiftCalendarMonth(-1)" class="px-2 py-0.5 rounded bg-slate-100">◀</button>
            <span>${y} 年 ${m + 1} 月</span>
            <button type="button" onclick="shiftCalendarMonth(1)" class="px-2 py-0.5 rounded bg-slate-100">▶</button>
          </div>
          <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400">
            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center">${cells}</div>
        </div>
      `;
    }

    window.toggleCalendarPopover = () => { state.calendarOpen = !state.calendarOpen; openIslandDrawer('camp'); };
    window.shiftCalendarMonth = (delta) => { state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + delta, 1); openIslandDrawer('camp'); };
    window.selectCalendarDay = (ds) => { state.selectedExamDate = ds; state.calendarOpen = false; openIslandDrawer('camp'); };
    window.pickNativeExamDate = (val) => { if (val) { state.selectedExamDate = val.replace(/-/g, '/'); state.calendarOpen = false; openIslandDrawer('camp'); } };
    window.togglePortalStep = (id) => { state.checkedSteps[id] = !state.checkedSteps[id]; openIslandDrawer('portal'); };
    window.setVillageFilter = (tag) => { state.villageFilter = tag; openIslandDrawer('village'); };
    window.setCampSubTab = (tab) => { state.campSubTab = tab; openIslandDrawer('camp'); };
    window.selectCampCert = (cert) => { state.selectedCert = cert; openIslandDrawer('camp'); };
    window.toggleTeamExpand = (id) => { state.expandedTeamIds[id] = !state.expandedTeamIds[id]; openIslandDrawer('camp'); };
    window.setPeaksCohort = (g) => { state.peaksCohort = g; openIslandDrawer('peaks'); };
    window.setOfferFilter = (f) => { state.offerFilter = f; openIslandDrawer('workplace'); };

    window.createNewPracticeTeam = () => {
      if (state.role !== 'student') return;
      const loc = document.getElementById('new-team-loc').value.trim();
      if (!state.selectedExamDate || !loc) return;
      const leaderName = state.studentProfile ? state.studentProfile.name : `在校生(${state.studentLast3})`;
      const leaderGrade = state.studentProfile ? state.studentProfile.grade : '在校生';
      const newId = 'tm_' + Date.now();
      PRACTICE_TEAMS.unshift({
        id: newId, cert: state.selectedCert, examDate: `${state.selectedExamDate} 應試梯次`,
        leader: leaderName, leaderId: state.studentFullId, grade: leaderGrade,
        location: loc, max: 5, joined: true,
        members: [{ name: leaderName, studentId: state.studentFullId, grade: leaderGrade, role: '團長', note: '歡迎一起組隊練功！' }]
      });
      state.expandedTeamIds[newId] = true;
      state.selectedExamDate = '';
      openIslandDrawer('camp');
    };

    window.joinPracticeTeam = (id) => {
      if (state.role !== 'student') return;
      const tm = PRACTICE_TEAMS.find(t => t.id === id);
      if (!tm || tm.joined) return;
      const name = state.studentProfile ? state.studentProfile.name : `在校生(${state.studentLast3})`;
      const grade = state.studentProfile ? state.studentProfile.grade : '在校生';
      tm.joined = true;
      tm.members.push({ name, studentId: state.studentFullId, grade, role: '成員', note: '+1 一起衝刺考照！' });
      state.expandedTeamIds[id] = true;
      openIslandDrawer('camp');
    };

    window.submitNewStudyNote = () => {
      if (state.role !== 'student') return;
      const sid = document.getElementById('note-sid').value.trim();
      const name = document.getElementById('note-name').value.trim();
      const cert = document.getElementById('note-cert').value;
      const tip = document.getElementById('note-tip').value.trim();
      const app = document.getElementById('note-app').value.trim();
      if (!sid || !name || !tip) return;
      const matched = findStudentById(sid);
      STUDY_NOTES_LIBRARY.unshift({
        id: 'n_' + Date.now(), cert, author: name, studentId: sid,
        cohort: matched ? matched.grade : '在校生',
        appOrSite: app || '系上共學講義', summary: tip
      });
      openIslandDrawer('camp');
    };

    /* =========================================================================
       7. 身分切換彈窗與啟動流程
       ========================================================================= */
    let modalRoleChoice = 'visitor';

    function openRoleModal(preselect) {
      modalRoleChoice = preselect || state.role || 'visitor';
      updateRoleModalUI();
      const modal = document.getElementById('role-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function updateRoleModalUI() {
      const vBtn = document.getElementById('choice-visitor');
      const sBtn = document.getElementById('choice-student');
      const idSec = document.getElementById('student-id-section');
      if (!vBtn || !sBtn || !idSec) return;
      if (modalRoleChoice === 'student') {
        sBtn.className = 'text-left p-4 rounded-2xl border-2 border-[#2b7a9b] bg-[#e4f0f7] transition focus:outline-none';
        vBtn.className = 'text-left p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-[#3d7a47] transition focus:outline-none';
        idSec.classList.remove('hidden');
      } else {
        vBtn.className = 'text-left p-4 rounded-2xl border-2 border-[#3d7a47] bg-[#eff7f1] transition focus:outline-none';
        sBtn.className = 'text-left p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-[#2b7a9b] transition focus:outline-none';
        idSec.classList.add('hidden');
      }
    }

    function updateHudRoleBadge() {
      const dot = document.getElementById('role-dot');
      const txt = document.getElementById('role-badge-text');
      if (!dot || !txt) return;
      if (state.role === 'student') {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-[#2b7a9b]';
        txt.textContent = state.studentProfile
          ? `${state.studentProfile.grade} ${state.studentProfile.name} (${state.studentLast3})`
          : `在校生 (末三碼: ${state.studentLast3})`;
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-[#3d7a47]';
        txt.textContent = '訪客模式';
      }
    }

    function syncSessionFromStorage() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.role === 'student' && parsed.last3) {
            state.role = 'student';
            state.studentLast3 = parsed.last3;
            state.studentFullId = parsed.fullId || '';
            if (parsed.displayName) {
              state.studentProfile = { grade: parsed.grade || '在校生', name: parsed.displayName };
            }
            document.getElementById('role-modal')?.classList.add('hidden');
          }
        }
      } catch (e) {}
    }

    function bindRoleModalEvents() {
      const vBtn = document.getElementById('choice-visitor');
      const sBtn = document.getElementById('choice-student');
      const switchBtn = document.getElementById('btn-switch-role');
      const closeDrawerBtn = document.getElementById('btn-close-drawer');
      const confirmBtn = document.getElementById('btn-confirm-role');

      if (vBtn) vBtn.onclick = () => { modalRoleChoice = 'visitor'; updateRoleModalUI(); };
      if (sBtn) sBtn.onclick = () => { modalRoleChoice = 'student'; updateRoleModalUI(); };
      if (switchBtn) switchBtn.onclick = () => openRoleModal(state.role);
      if (closeDrawerBtn) closeDrawerBtn.onclick = closeIslandDrawer;

      if (confirmBtn) {
        confirmBtn.onclick = () => {
          if (modalRoleChoice === 'student') {
            const raw = (document.getElementById('student-id-input')?.value || '').trim();
            if (!/^[A-Za-z0-9]{7,10}$/.test(raw)) {
              document.getElementById('student-id-error')?.classList.remove('hidden');
              return;
            }
            document.getElementById('student-id-error')?.classList.add('hidden');
            state.role = 'student';
            state.studentFullId = raw.toUpperCase();
            state.studentLast3 = state.studentFullId.slice(-3);
            state.studentProfile = findStudentById(state.studentFullId);
            try {
              sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                role: 'student',
                last3: state.studentLast3,
                grade: state.studentProfile ? state.studentProfile.grade : '在校生',
                displayName: state.studentProfile ? state.studentProfile.name : '',
                fullId: state.studentFullId
              }));
            } catch (e) {}
          } else {
            state.role = 'visitor';
            state.studentFullId = '';
            state.studentLast3 = '';
            state.studentProfile = null;
            try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
          }
          try { localStorage.setItem(ROLE_STORAGE_KEY, state.role); } catch (e) {}
          document.getElementById('role-modal')?.classList.add('hidden');
          updateHudRoleBadge();
          renderLabelsAndNav();
          if (state.selectedIslandId) openIslandDrawer(state.selectedIslandId);
        };
      }
    }

    function bootApp() {
      bindRoleModalEvents();
      syncSessionFromStorage();

      try {
        initThreeScene();
        requestAnimationFrame(animate);
      } catch (err) {
        console.warn('3D 場景初始化略過或重試：', err);
      }

      renderLabelsAndNav();
      updateHudRoleBadge();
      fetchJiaoxiWeather();

      document.getElementById('btn-motion-toggle').onclick = () => {
        state.reduceMotion = !state.reduceMotion;
        document.body.classList.toggle('reduce-motion', state.reduceMotion);
        document.getElementById('motion-icon').textContent = state.reduceMotion ? '⏸️' : '🍃';
        document.getElementById('motion-text').textContent = state.reduceMotion ? '已減少動態' : '柔和動態';
      };

      document.getElementById('btn-weather-mode').onclick = () => {
        const order = ['live', 'clear', 'rain'];
        state.weatherMode = order[(order.indexOf(state.weatherMode) + 1) % order.length];
        const btn = document.getElementById('btn-weather-mode');
        if (state.weatherMode === 'live') {
          btn.textContent = '即時';
          fetchJiaoxiWeather();
        } else if (state.weatherMode === 'clear') {
          btn.textContent = '預覽晴天';
          applyWeatherVisuals('clear', '24°C', '晴朗微風 (預覽)');
        } else {
          btn.textContent = '預覽細雨';
          applyWeatherVisuals('rain', '19°C', '蘭陽細雨 (預覽)');
        }
      };

      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && state.selectedIslandId) closeIslandDrawer();
      });

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        state.reduceMotion = true;
        document.body.classList.add('reduce-motion');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
