    }

    function createSeededRandom(seed) {
      return function () {
        let t = (seed += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function makeRoundedHill(rx, h, rz, colorHex, hasSnow = false) {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(1, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.5);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const profile = Math.pow(Math.cos(y * Math.PI * 0.48), 0.72);
        pos.setX(i, pos.getX(i) * profile * rx);
        pos.setZ(i, pos.getZ(i) * profile * rz);
        pos.setY(i, y * h);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.85 }));
      group.add(mesh);

      if (hasSnow) {
        const snowGeo = new THREE.SphereGeometry(1, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.24);
        const sPos = snowGeo.attributes.position;
        for (let i = 0; i < sPos.count; i++) {
          const y = sPos.getY(i);
          const profile = Math.pow(Math.cos(y * Math.PI * 0.48), 0.72);
          sPos.setX(i, sPos.getX(i) * profile * rx * 1.01);
          sPos.setZ(i, sPos.getZ(i) * profile * rz * 1.01);
          sPos.setY(i, y * h + 0.06);
        }
        snowGeo.computeVertexNormals();
        group.add(new THREE.Mesh(snowGeo, new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.65 })));
      }
      return group;
    }

      const mat = new THREE.MeshStandardMaterial({ color: 0x93c5fd, emissive: 0xfde047, emissiveIntensity: 0.15, roughness: 0.25 });
      windowMats.push(mat);

      const barH = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, 0.12), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
      g.add(frame, glass, barV, barH);

    }

    function makeStylizedTree(scale = 1, variant = 0) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11 * scale, 0.19 * scale, 1.05 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x7c4d2b, roughness: 0.9 })
      );
      trunk.position.y = 0.52 * scale;

      const palette = variant === 0
        ? [0x2d6a4f, 0x40916c, 0x52b788]
        : [0x3d7a47, 0x5a9e4b, 0x74b85e];

      if (variant === 0) {
        for (let i = 0; i < 3; i++) {
          const cone = new THREE.Mesh(
            new THREE.ConeGeometry((0.88 - i * 0.2) * scale, 1.05 * scale, 10),
            new THREE.MeshStandardMaterial({ color: palette[i], roughness: 0.8 })
          );
          cone.position.y = (1.15 + i * 0.55) * scale;
          tree.add(cone);
        }
      } else {
        const puffOffsets = [
          { x: 0, y: 1.45, z: 0, r: 0.78, c: palette[0] },
          { x: -0.35, y: 1.25, z: 0.25, r: 0.55, c: palette[1] },
          { x: 0.36, y: 1.3, z: -0.2, r: 0.52, c: palette[2] }
        ];
        puffOffsets.forEach(p => {
          const puff = new THREE.Mesh(
            new THREE.SphereGeometry(p.r * scale, 12, 10),
            new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.82 })
          );
          puff.position.set(p.x * scale, p.y * scale, p.z * scale);
          tree.add(puff);
        });
      }
      return tree;
    }

          new THREE.MeshStandardMaterial({ color: 0xe6d5b8, roughness: 0.85 })
        );
        beach.position.y = 0.24;
        beach.userData.islandId = cfg.id;

        const grass = new THREE.Mesh(
          new THREE.CylinderGeometry(cfg.radius * 1.01, cfg.radius * 1.03, 0.46, 20),
          new THREE.MeshStandardMaterial({ color: 0x5a9e4b, roughness: 0.8 })
        );
        grass.position.y = 0.48;
        grass.userData.islandId = cfg.id;

        root.add(lowerRock, rock, beach, grass);
        clickableMeshes.push(lowerRock, rock, beach, grass);

        // 種植樹木與灌木
        (treePlacements[idx] || []).forEach((tp, ti) => {
          const tree = makeStylizedTree(tp.s, tp.v);
          tree.position.set(Math.cos(tp.a) * cfg.radius * tp.d, 0.68, Math.sin(tp.a) * cfg.radius * tp.d);
          tree.rotation.y = ti * 1.1;
          root.add(tree);

          const bush = new THREE.Mesh(
            new THREE.SphereGeometry(0.32 * tp.s, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0x6ab058, roughness: 0.85 })
          );
          bush.scale.set(1.3, 0.75, 1.1);
          bush.position.set(
            Math.cos(tp.a + 0.22) * cfg.radius * (tp.d * 0.92),
            0.76,
            Math.sin(tp.a + 0.22) * cfg.radius * (tp.d * 0.92)
          );
          root.add(bush);
        });

        // 島嶼專屬精緻地標
        if (cfg.id === 'portal') {
          const stoneMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 });
          const trimMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.35 });
          const step = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.24, 1.8), stoneMat); step.position.set(0, 0.78, 0);
          const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.55, 3.2, 0.65), stoneMat); p1.position.set(-1.35, 2.35, 0);
          const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.55, 3.2, 0.65), stoneMat); p2.position.set(1.35, 2.35, 0);
          const top = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.62, 0.8), stoneMat); top.position.set(0, 4.1, 0);
          const runeTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.16, 0.86), trimMat); runeTop.position.set(0, 4.1, 0);
          const core = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 3.1), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.45, transparent: true, opacity: 0.72, side: THREE.DoubleSide }));
          core.position.set(0, 2.35, 0);
          root.add(step, p1, p2, top, runeTop, core);
        } else if (cfg.id === 'village') {
          const wall = new THREE.Mesh(new THREE.BoxGeometry(3.1, 2.15, 2.6), new THREE.MeshStandardMaterial({ color: 0xfbf7ee, roughness: 0.75 }));
          wall.position.set(0, 1.75, -0.35);
          const roof = new THREE.Mesh(new THREE.ConeGeometry(2.48, 1.45, 4), new THREE.MeshStandardMaterial({ color: 0xc2593f, roughness: 0.75 }));
          roof.position.set(0, 3.5, -0.35); roof.rotation.y = Math.PI * 0.25;
          const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.95, 0.42), new THREE.MeshStandardMaterial({ color: 0x9c422c }));
          chimney.position.set(0.85, 3.75, -0.65);
          const porch = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.18, 0.55), new THREE.MeshStandardMaterial({ color: 0xd6cfc2 }));
          porch.position.set(-0.5, 0.78, 1.15);
          const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.25, 0.1), new THREE.MeshStandardMaterial({ color: 0x7c4a27 }));
          door.position.set(-0.5, 1.4, 0.97);
          const win1 = makeWindow(0.74, 0.74); win1.position.set(0.68, 1.85, 0.97);
          const win2 = makeWindow(0.74, 0.74); win2.rotation.y = Math.PI * 0.5; win2.position.set(1.57, 1.85, -0.35);
          const win3 = makeWindow(0.74, 0.74); win3.rotation.y = -Math.PI * 0.5; win3.position.set(-1.57, 1.85, -0.35);
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.8, 8), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
          pole.position.set(2.3, 2.05, 0.9);
          const flag = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.56, 0.06), new THREE.MeshStandardMaterial({ color: 0x2b7a9b }));
          flag.position.set(2.78, 3.1, 0.9);
          root.add(wall, roof, chimney, porch, door, win1, win2, win3, pole, flag);
        } else if (cfg.id === 'camp') {
          const tent = new THREE.Mesh(new THREE.ConeGeometry(1.65, 2.0, 4), new THREE.MeshStandardMaterial({ color: 0xd97742, roughness: 0.8 }));
          tent.position.set(-0.65, 1.68, -0.55); tent.rotation.y = Math.PI * 0.25;
          const tentFlap = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.35, 3), new THREE.MeshStandardMaterial({ color: 0x7c3a1d }));
          tentFlap.position.set(-0.15, 1.35, 0.25); tentFlap.rotation.y = Math.PI * 0.25;
          for (let lg = 0; lg < 3; lg++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.1, 8), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
            log.position.set(1.15, 0.8, 0.95);
            log.rotation.set(Math.PI * 0.45, lg * (Math.PI / 3), 0);
            root.add(log);
          }
          const flame = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.85, 8), new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.45 }));
          flame.position.set(1.15, 1.25, 0.95);
          root.add(tent, tentFlap, flame);
        } else if (cfg.id === 'peaks') {
          const peakMain = makeRoundedHill(2.9, 4.9, 2.9, 0x4f6d7a, true);
          peakMain.position.set(-0.2, 0.65, -0.35);
          const peakSub = makeRoundedHill(1.9, 3.1, 1.9, 0x5c7c8a, true);
          peakSub.position.set(1.75, 0.65, 0.65);
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 8), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          pole.position.set(-0.2, 5.8, -0.35);
          const pennant = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.46, 0.05), new THREE.MeshStandardMaterial({ color: 0xd9534f }));
          pennant.position.set(0.22, 6.1, -0.35);
          root.add(peakMain, peakSub, pole, pennant);
        } else if (cfg.id === 'workplace') {
          const tower = new THREE.Mesh(new THREE.BoxGeometry(2.85, 4.7, 2.5), new THREE.MeshStandardMaterial({ color: 0x4b6584, roughness: 0.6 }));
          tower.position.set(0, 3.0, -0.25);
          const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.16, 0.65), new THREE.MeshStandardMaterial({ color: 0x334155 }));
          canopy.position.set(0, 1.95, 1.2);
          const door = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.2, 0.1), new THREE.MeshStandardMaterial({ color: 0xbae6fd }));
          door.position.set(0, 1.28, 1.02);
          for (let r = 0; r < 3; r++) {
            for (let c = -1; c <= 1; c++) {
              const w = makeWindow(0.48, 0.52);
              w.position.set(c * 0.78, 2.55 + r * 0.92, 1.02);
              root.add(w);
            }
          }
          const sign = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.78, 0.28), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
          sign.position.set(0, 5.85, -0.25);
          root.add(tower, canopy, door, sign);
        }

        // 島上散步同學
        const stuCount = cfg.radius >= 5.8 ? 4 : 3;
        for (let s = 0; s < stuCount; s++) {
          const stu = new THREE.Group();
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.62, 10), new THREE.MeshStandardMaterial({ color: shirtPalette[(idx + s) % shirtPalette.length] }));
          body.position.y = 0.45;
          const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 10), new THREE.MeshStandardMaterial({ color: 0xf6d3b8 }));
          head.position.y = 0.96;
          stu.add(body, head);
          const ang = (s / stuCount) * Math.PI * 2;
          stu.position.set(Math.cos(ang) * cfg.radius * 0.48, 0.7, Math.sin(ang) * cfg.radius * 0.48);
          root.add(stu);
          students.push({ mesh: stu, islandIdx: idx, angle: ang, speed: 0.45 + s * 0.1, onBridge: false, bridgeIdx: idx, progress: 0 });
        }

        scene.add(root);
        islandGroups[cfg.id] = { group: root, phase: idx * 1.25, cfg };
      });

      // 環狀木造吊橋
      for (let i = 0; i < ISLAND_CONFIGS.length; i++) {
        const next = (i + 1) % ISLAND_CONFIGS.length;
        const bridgeGroup = new THREE.Group();
        const planks = [];
        for (let p = 0; p < 14; p++) {
          const plank = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.08, 0.48), new THREE.MeshStandardMaterial({ color: 0xa47148 }));
          bridgeGroup.add(plank);
          planks.push(plank);
        }
        const ropeMat = new THREE.LineBasicMaterial({ color: 0x5c3a21 });
        const ropeL = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 15 }, () => new THREE.Vector3())), ropeMat);
        const ropeR = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 15 }, () => new THREE.Vector3())), ropeMat);
        bridgeGroup.add(ropeL, ropeR);
        scene.add(bridgeGroup);
        bridges.push({ from: i, to: next, planks, ropeL, ropeR });
      }

      // 台灣藍鵲
      for (let i = 0; i < 4; i++) {
        const magpie = makeFormosanBlueMagpie();
        scene.add(magpie.group);
        magpies.push({ group: magpie.group, lWing: magpie.lWing, rWing: magpie.rWing, r: 19 + i * 5.5, y: 12.5 + i * 1.7, speed: 0.24 + i * 0.03, phase: i * 1.55 });
      }

      // 雲朵
      for (let i = 0; i < 6; i++) {
        const c = new THREE.Mesh(new THREE.SphereGeometry(2.2, 10, 8), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.78 }));
        c.scale.set(1.8, 0.65, 1.1);
        c.position.set(-40 + i * 16, 22 + (i % 3) * 2.5, -25 + (i % 2) * 30);
        scene.add(c);
        clouds.push(c);
      }

      // 雨滴粒子
      const rainCount = 300;
      const rainPos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount; i++) {
        rainPos[i * 3] = (Math.random() - 0.5) * 90;
        rainPos[i * 3 + 1] = Math.random() * 35;
        rainPos[i * 3 + 2] = (Math.random() - 0.5) * 90;
      }
      const rainGeo = new THREE.BufferGeometry();
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
      rainSystem = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xdbeafe, size: 0.28, transparent: true, opacity: 0.65 }));
      rainSystem.visible = false;
      scene.add(rainSystem);

      // 3D 點擊偵測
      const raycaster = new THREE.Raycaster();
      const ptr = new THREE.Vector2();
      let downPos = { x: 0, y: 0 };
      renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 7) return;
        const rect = renderer.domElement.getBoundingClientRect();
        ptr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        ptr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(ptr, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, true);
        if (hits.length > 0 && hits[0].object.userData.islandId) {
          focusOnIsland(hits[0].object.userData.islandId);
        }
      });

      window.addEventListener('resize', () => {
        if (!renderer || !camera) return;
        camera.aspect = Math.max(1, container.clientWidth) / Math.max(1, container.clientHeight);
        camera.updateProjectionMatrix();
        renderer.setSize(Math.max(1, container.clientWidth), Math.max(1, container.clientHeight));
      });
    }

    function updateProjectedLabelsPosition() {
      const layer = document.getElementById('labels-layer');
      if (!layer || !camera) return;
      const w = layer.clientWidth || window.innerWidth;
      const h = layer.clientHeight || window.innerHeight;
      ISLAND_CONFIGS.forEach((cfg) => {
        const el = document.getElementById(`label-${cfg.id}`);
        const grp = islandGroups[cfg.id];
        if (!el || !grp) return;
        const v = new THREE.Vector3(grp.group.position.x, grp.group.position.y + 6.4, grp.group.position.z);
        v.project(camera);
        if (v.z > 1) {
          el.style.opacity = '0';
        } else {
          el.style.opacity = '1';
          el.style.left = `${(v.x * 0.5 + 0.5) * w}px`;
          el.style.top = `${(-v.y * 0.5 + 0.5) * h}px`;
        }
      });
    }

    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      const t = now * 0.001;

      if (!state.reduceMotion) {
        if (waterMesh && waterBasePos) {
          const arr = waterMesh.geometry.attributes.position.array;
          for (let i = 0; i < arr.length; i += 3) {
            arr[i + 1] = waterBasePos[i + 1] + Math.sin(t * 1.1 + waterBasePos[i] * 0.1 + waterBasePos[i + 2] * 0.1) * 0.22;
          }
          waterMesh.geometry.attributes.position.needsUpdate = true;
        }

        Object.values(islandGroups).forEach((obj) => {
          obj.group.position.y = Math.sin(t * 0.9 + obj.phase) * 0.28;
        });

        smokeParticles.forEach((p) => {
          const cycle = (t * 0.16 + p.offset) % 1;
          p.mesh.position.set(70 + cycle * 2.5, 8.2 + cycle * 9, -1.5 + Math.sin(t + p.offset * 5) * 0.8);
          p.mesh.material.opacity = (1 - cycle) * 0.45;
        });

        clouds.forEach((c) => {
          c.position.x += dt * 0.8;
          if (c.position.x > 65) c.position.x = -65;
        });

        magpies.forEach((m) => {
          const ang = t * m.speed + m.phase;
          m.group.position.set(Math.cos(ang) * m.r, m.y + Math.sin(t * 1.5 + m.phase) * 0.6, Math.sin(ang) * m.r);
          m.group.rotation.y = -ang;
          const flap = Math.sin(t * 6.5 + m.phase) * 0.42;
          m.lWing.rotation.z = flap;
          m.rWing.rotation.z = -flap;
        });

        students.forEach((st, idx) => {
          const cfg = ISLAND_CONFIGS[st.islandIdx];
          if (!st.onBridge) {
            st.angle += st.speed * dt;
            const r = cfg.radius * 0.48;
            st.mesh.position.set(Math.cos(st.angle) * r, 0.7 + Math.abs(Math.sin(t * 5 + idx)) * 0.08, Math.sin(st.angle) * r);
            if (Math.sin(t * 0.35 + idx * 2.1) > 0.96) {
              st.onBridge = true;
              st.bridgeIdx = st.islandIdx;
              st.progress = 0;
              scene.add(st.mesh);
            }
          } else {
            st.progress += dt * 0.28;
            const aObj = islandGroups[ISLAND_CONFIGS[st.bridgeIdx].id];
            const bObj = islandGroups[ISLAND_CONFIGS[(st.bridgeIdx + 1) % ISLAND_CONFIGS.length].id];
            const pA = aObj.group.position;
            const pB = bObj.group.position;
            const u = new THREE.Vector3().subVectors(pB, pA).normalize();
            const sPt = pA.clone().addScaledVector(u, aObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
            const ePt = pB.clone().addScaledVector(u, -bObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
            const pos = new THREE.Vector3().lerpVectors(sPt, ePt, Math.min(1, st.progress));
            pos.y -= Math.sin(Math.min(1, st.progress) * Math.PI) * 0.65;
            st.mesh.position.copy(pos);
            if (st.progress >= 1) {
              st.onBridge = false;
              st.islandIdx = (st.bridgeIdx + 1) % ISLAND_CONFIGS.length;
              islandGroups[ISLAND_CONFIGS[st.islandIdx].id].group.add(st.mesh);
            }
          }
        });
      }

      // 更新環狀吊橋
      bridges.forEach((br) => {
        const aObj = islandGroups[ISLAND_CONFIGS[br.from].id];
        const bObj = islandGroups[ISLAND_CONFIGS[br.to].id];
        const pA = aObj.group.position;
        const pB = bObj.group.position;
        const dir = new THREE.Vector3().subVectors(pB, pA);
        const u = dir.clone().normalize();
        const sPt = pA.clone().addScaledVector(u, aObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
        const ePt = pB.clone().addScaledVector(u, -bObj.cfg.radius * 0.96).add(new THREE.Vector3(0, 0.72, 0));
        const yaw = Math.atan2(u.x, u.z);
        const sideVec = new THREE.Vector3(-u.z, 0, u.x).multiplyScalar(0.55);

        br.planks.forEach((pk, pi) => {
          const frac = (pi + 0.5) / br.planks.length;
          const pos = new THREE.Vector3().lerpVectors(sPt, ePt, frac);
          pos.y -= Math.sin(frac * Math.PI) * 0.65;
          pk.position.copy(pos);
          pk.rotation.y = yaw;
        });

        const ptsL = [], ptsR = [];
        for (let k = 0; k <= 14; k++) {
          const frac = k / 14;
          const pt = new THREE.Vector3().lerpVectors(sPt, ePt, frac);
          pt.y += 0.68 - Math.sin(frac * Math.PI) * 0.5;
          ptsL.push(pt.clone().add(sideVec));
          ptsR.push(pt.clone().sub(sideVec));
        }
        br.ropeL.geometry.setFromPoints(ptsL);
        br.ropeR.geometry.setFromPoints(ptsR);
      });

      if (rainSystem && rainSystem.visible && !state.reduceMotion) {
        const rArr = rainSystem.geometry.attributes.position.array;
        for (let i = 1; i < rArr.length; i += 3) {
          rArr[i] -= dt * 28;
          if (rArr[i] < -1) rArr[i] = 34;
        }
        rainSystem.geometry.attributes.position.needsUpdate = true;
      }

      if (cameraAnim.active) {
        camera.position.lerp(cameraAnim.targetPos, 0.08);
        controls.target.lerp(cameraAnim.targetLook, 0.08);
        if (camera.position.distanceTo(cameraAnim.targetPos) < 0.25) cameraAnim.active = false;
      }

      controls.update();
      renderer.render(scene, camera);
      updateProjectedLabelsPosition();
    }

    /* =========================================================================
       5. 導覽列、名牌與抽屜互動
       ========================================================================= */
    function renderLabelsAndNav() {
      const layer = document.getElementById('labels-layer');
      const nav = document.getElementById('bottom-nav-bar');
      layer.innerHTML = '';
      nav.innerHTML = '';

      ISLAND_CONFIGS.forEach((cfg) => {
        const isLocked = cfg.restricted && state.role !== 'student';

        const label = document.createElement('div');
        label.id = `label-${cfg.id}`;
        label.className = 'island-label';
        label.innerHTML = `
          <div class="island-label-card ${isLocked ? 'locked' : ''}">
            <span>${isLocked ? '🔒' : cfg.icon}</span>
            <span class="text-xs font-black">${cfg.name}</span>
          </div>
          <div class="island-label-pin"></div>
        `;
        label.onclick = () => focusOnIsland(cfg.id);
        layer.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex-shrink-0 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition ${
          state.selectedIslandId === cfg.id
            ? 'bg-[#2b5b78] text-white shadow-sm'
            : isLocked
              ? 'bg-slate-100 text-slate-500'
              : 'bg-white hover:bg-[#e4f0f7] text-slate-700 border border-slate-200/80'
        }`;
        btn.innerHTML = `<span>${isLocked ? '🔒' : cfg.icon}</span><span>${cfg.name}</span>`;
        btn.onclick = () => focusOnIsland(cfg.id);
        nav.appendChild(btn);
      });
    }

    function drawMiniIslandCanvas(islandId) {
      const canvas = document.getElementById('mini-island-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);
      ctx.fillStyle = '#2b7a9b';
      ctx.fillRect(0, 82, 128, 46);
      ctx.fillStyle = '#a67c5b';
      ctx.beginPath(); ctx.ellipse(64, 84, 42, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a9e4b';
      ctx.beginPath(); ctx.ellipse(64, 74, 44, 15, 0, 0, Math.PI * 2); ctx.fill();

      const cfg = ISLAND_CONFIGS.find(i => i.id === islandId);
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cfg ? cfg.icon : '🏝️', 64, 62);
    }

    function focusOnIsland(islandId) {
      const cfg = ISLAND_CONFIGS.find(i => i.id === islandId);
      if (!cfg) return;
      state.selectedIslandId = islandId;
      cameraAnim.targetPos.set(cfg.pos.x, 14, cfg.pos.z + 18);
      cameraAnim.targetLook.set(cfg.pos.x + 2, 1.5, cfg.pos.z);
      cameraAnim.active = true;
      renderLabelsAndNav();
      openIslandDrawer(islandId);
    }

    function closeIslandDrawer() {
      state.selectedIslandId = null;
      const drawer = document.getElementById('island-drawer');
      drawer.classList.add('translate-y-full', 'md:translate-x-full');
      cameraAnim.targetPos.copy(DEFAULT_CAM_POS);
      cameraAnim.targetLook.copy(DEFAULT_LOOK_AT);
      cameraAnim.active = true;
      renderLabelsAndNav();
    }

    function openIslandDrawer(islandId) {
      const cfg = ISLAND_CONFIGS.find(i => i.id === islandId);
      if (!cfg) return;
      const drawer = document.getElementById('island-drawer');
      const body = document.getElementById('drawer-body');
      const isLocked = cfg.restricted && state.role !== 'student';

      document.getElementById('drawer-stage-badge').textContent = cfg.stage;
      document.getElementById('drawer-title').textContent = `${cfg.icon} ${cfg.name}`;
      document.getElementById('drawer-subtitle').textContent = cfg.subtitle;
      document.getElementById('drawer-lock-badge').classList.toggle('hidden', !isLocked);
      drawMiniIslandCanvas(islandId);

      if (isLocked) {
        body.innerHTML = `

    /* =========================================================================
       6. 互動事件與日曆選擇器
       ========================================================================= */
    function renderCalendarPopover() {
      const y = state.calendarMonth.getFullYear();
      const m = state.calendarMonth.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += '<div></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${y}/${String(m + 1).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
        const active = state.selectedExamDate === ds;
        cells += `<button type="button" onclick="selectCalendarDay('${ds}')"
          class="py-1 rounded-lg text-[11px] font-bold ${active ? 'bg-[#b5653b] text-white' : 'hover:bg-amber-50 text-slate-700'}">${d}</button>`;
      }
      return `
        <div class="p-3 rounded-2xl bg-white border border-slate-300 shadow-lg space-y-2">
          <div class="flex items-center justify-between text-xs font-black">
            <button type="button" onclick="shiftCalendarMonth(-1)" class="px-2 py-0.5 rounded bg-slate-100">◀</button>
            <span>${y} 年 ${m + 1} 月</span>
            <button type="button" onclick="shiftCalendarMonth(1)" class="px-2 py-0.5 rounded bg-slate-100">▶</button>
          </div>
          <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400">
            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center">${cells}</div>
        </div>
      `;
    }

    window.toggleCalendarPopover = () => { state.calendarOpen = !state.calendarOpen; openIslandDrawer('camp'); };
    window.shiftCalendarMonth = (delta) => { state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + delta, 1); openIslandDrawer('camp'); };
    window.selectCalendarDay = (ds) => { state.selectedExamDate = ds; state.calendarOpen = false; openIslandDrawer('camp'); };
    window.pickNativeExamDate = (val) => { if (val) { state.selectedExamDate = val.replace(/-/g, '/'); state.calendarOpen = false; openIslandDrawer('camp'); } };
    window.togglePortalStep = (id) => { state.checkedSteps[id] = !state.checkedSteps[id]; openIslandDrawer('portal'); };
    window.setVillageFilter = (tag) => { state.villageFilter = tag; openIslandDrawer('village'); };
    window.setCampSubTab = (tab) => { state.campSubTab = tab; openIslandDrawer('camp'); };
    window.selectCampCert = (cert) => { state.selectedCert = cert; openIslandDrawer('camp'); };
    window.toggleTeamExpand = (id) => { state.expandedTeamIds[id] = !state.expandedTeamIds[id]; openIslandDrawer('camp'); };
    window.setPeaksCohort = (g) => { state.peaksCohort = g; openIslandDrawer('peaks'); };
    window.setOfferFilter = (f) => { state.offerFilter = f; openIslandDrawer('workplace'); };

    window.createNewPracticeTeam = () => {
      if (state.role !== 'student') return;
      const loc = document.getElementById('new-team-loc').value.trim();
      if (!state.selectedExamDate || !loc) return;
      const leaderName = state.studentProfile ? state.studentProfile.name : `在校生(${state.studentLast3})`;
      const leaderGrade = state.studentProfile ? state.studentProfile.grade : '在校生';
      const newId = 'tm_' + Date.now();
      PRACTICE_TEAMS.unshift({
        id: newId, cert: state.selectedCert, examDate: `${state.selectedExamDate} 應試梯次`,
        leader: leaderName, leaderId: state.studentFullId, grade: leaderGrade,
        location: loc, max: 5, joined: true,
        members: [{ name: leaderName, studentId: state.studentFullId, grade: leaderGrade, role: '團長', note: '歡迎一起組隊練功！' }]
      });
      state.expandedTeamIds[newId] = true;
      state.selectedExamDate = '';
      openIslandDrawer('camp');
    };

    window.joinPracticeTeam = (id) => {
      if (state.role !== 'student') return;
      const tm = PRACTICE_TEAMS.find(t => t.id === id);
      if (!tm || tm.joined) return;
      const name = state.studentProfile ? state.studentProfile.name : `在校生(${state.studentLast3})`;
      const grade = state.studentProfile ? state.studentProfile.grade : '在校生';
      tm.joined = true;
      tm.members.push({ name, studentId: state.studentFullId, grade, role: '成員', note: '+1 一起衝刺考照！' });
      state.expandedTeamIds[id] = true;
      openIslandDrawer('camp');
    };

    window.submitNewStudyNote = () => {
      if (state.role !== 'student') return;
      const sid = document.getElementById('note-sid').value.trim();
      const name = document.getElementById('note-name').value.trim();
      const cert = document.getElementById('note-cert').value;
      const tip = document.getElementById('note-tip').value.trim();
      const app = document.getElementById('note-app').value.trim();
      if (!sid || !name || !tip) return;
      const matched = findStudentById(sid);
      STUDY_NOTES_LIBRARY.unshift({
        id: 'n_' + Date.now(), cert, author: name, studentId: sid,
        cohort: matched ? matched.grade : '在校生',
        appOrSite: app || '系上共學講義', summary: tip
      });
      openIslandDrawer('camp');
    };

    /* =========================================================================
       7. 身分切換彈窗與啟動流程
       ========================================================================= */
    let modalRoleChoice = 'visitor';

    function openRoleModal(preselect) {
      modalRoleChoice = preselect || state.role || 'visitor';
      updateRoleModalUI();
      document.getElementById('role-modal').classList.remove('hidden');
    }

    function updateRoleModalUI() {
      const vBtn = document.getElementById('choice-visitor');
      const sBtn = document.getElementById('choice-student');
      const idSec = document.getElementById('student-id-section');
      if (modalRoleChoice === 'student') {
        sBtn.className = 'text-left p-4 rounded-2xl border-2 border-[#2b7a9b] bg-[#e4f0f7] transition focus:outline-none';
        vBtn.className = 'text-left p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-[#3d7a47] transition focus:outline-none';
        idSec.classList.remove('hidden');
      } else {
        vBtn.className = 'text-left p-4 rounded-2xl border-2 border-[#3d7a47] bg-[#eff7f1] transition focus:outline-none';
        sBtn.className = 'text-left p-4 rounded-2xl border-2 border-slate-200 bg-white hover:border-[#2b7a9b] transition focus:outline-none';
        idSec.classList.add('hidden');
      }
    }

    function updateHudRoleBadge() {
      const dot = document.getElementById('role-dot');
      const txt = document.getElementById('role-badge-text');
      if (state.role === 'student') {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-[#2b7a9b]';
        txt.textContent = state.studentProfile
          ? `${state.studentProfile.grade} ${state.studentProfile.name} (${state.studentLast3})`
          : `在校生 (末三碼: ${state.studentLast3})`;
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-[#3d7a47]';
        txt.textContent = '訪客模式';
      }
    }

    function bootApp() {
      // 若同網域子頁面已驗證過在校生，自動同步回 3D 入口主頁
      if (window.IslandAuth && window.IslandAuth.isStudent()) {
        const s = window.IslandAuth.getSession();
        state.role = 'student';
        state.studentLast3 = s.last3;
        if (s.displayName) {
          state.studentProfile = { grade: s.grade, name: s.displayName };
        }
        document.getElementById('role-modal').classList.add('hidden');
      }

      initThreeScene();
      renderLabelsAndNav();
      updateHudRoleBadge();
      fetchJiaoxiWeather();
      requestAnimationFrame(animate);

      document.getElementById('choice-visitor').onclick = () => { modalRoleChoice = 'visitor'; updateRoleModalUI(); };
      document.getElementById('choice-student').onclick = () => { modalRoleChoice = 'student'; updateRoleModalUI(); };
      document.getElementById('btn-switch-role').onclick = () => openRoleModal(state.role);
      document.getElementById('btn-close-drawer').onclick = closeIslandDrawer;

      document.getElementById('btn-confirm-role').onclick = () => {
        if (modalRoleChoice === 'student') {
          const raw = document.getElementById('student-id-input').value.trim();
          if (!/^[A-Za-z0-9]{7,10}$/.test(raw)) {
            document.getElementById('student-id-error').classList.remove('hidden');
            return;
          }
          document.getElementById('student-id-error').classList.add('hidden');
          state.role = 'student';
          state.studentFullId = raw.toUpperCase();
          state.studentLast3 = state.studentFullId.slice(-3);
          state.studentProfile = findStudentById(state.studentFullId);
          if (window.IslandAuth) window.IslandAuth.loginAsStudent(state.studentFullId);
        } else {
          state.role = 'visitor';
          state.studentFullId = '';
          state.studentLast3 = '';
          state.studentProfile = null;
          if (window.IslandAuth) window.IslandAuth.switchToVisitor();
        }
        try { localStorage.setItem(ROLE_STORAGE_KEY, state.role); } catch (e) {}
        document.getElementById('role-modal').classList.add('hidden');
        updateHudRoleBadge();
        renderLabelsAndNav();
        if (state.selectedIslandId) openIslandDrawer(state.selectedIslandId);
      };

      document.getElementById('btn-motion-toggle').onclick = () => {
        state.reduceMotion = !state.reduceMotion;
        document.body.classList.toggle('reduce-motion', state.reduceMotion);
        document.getElementById('motion-icon').textContent = state.reduceMotion ? '⏸️' : '🍃';
        document.getElementById('motion-text').textContent = state.reduceMotion ? '已減少動態' : '柔和動態';
      };

      document.getElementById('btn-weather-mode').onclick = () => {
        const order = ['live', 'clear', 'rain'];
        state.weatherMode = order[(order.indexOf(state.weatherMode) + 1) % order.length];
        const btn = document.getElementById('btn-weather-mode');
        if (state.weatherMode === 'live') {
          btn.textContent = '即時';
          fetchJiaoxiWeather();
        } else if (state.weatherMode === 'clear') {
          btn.textContent = '預覽晴天';
          applyWeatherVisuals('clear', '24°C', '晴朗微風 (預覽)');
        } else {
          btn.textContent = '預覽細雨';
          applyWeatherVisuals('rain', '19°C', '蘭陽細雨 (預覽)');
        }
      };

      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && state.selectedIslandId) closeIslandDrawer();
      });

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        state.reduceMotion = true;
        document.body.classList.add('reduce-motion');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
